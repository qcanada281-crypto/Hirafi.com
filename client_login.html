<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="cl_title">دخول العملاء — حرفي</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand: #0f766e; 
            --brand-dark: #115e59; 
            --accent: #ea580c;
            --bg: #0f172a; 
            --glass: rgba(255, 255, 255, 0.05); 
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc; 
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            overflow-y: auto;
            position: relative;
        }

        /* ─ Animated Background Orbs ─ */
        .bg-orbs { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
        .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.45; animation: float 10s ease-in-out infinite alternate; }
        .orb1 { width: 450px; height: 450px; background: radial-gradient(circle, var(--brand), transparent 70%); top: -100px; right: -150px; }
        .orb2 { width: 350px; height: 350px; background: radial-gradient(circle, var(--accent), transparent 70%); bottom: -100px; left: -100px; animation-delay: -5s; }
        .orb3 { width: 300px; height: 300px; background: radial-gradient(circle, #3b82f6, transparent 70%); top: 30%; left: 40%; animation-delay: -2s; opacity:0.25; }

        @keyframes float { 
            0% { transform: translateY(0) scale(1); } 
            100% { transform: translateY(-40px) scale(1.05); } 
        }

        /* ─ Wrapper & Logo ─ */
        .wrap { position: relative; z-index: 1; width: 100%; max-width: 480px; padding: 20px; }
        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-area .brand { 
            font-size: 2.8rem; font-weight: 900; 
            background: linear-gradient(135deg, #2dd4bf, #f97316); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .logo-area p { color: var(--muted); font-size: 1.05rem; font-weight: 600; }

        /* ─ Glassmorphism Card ─ */
        .card {
            background: var(--glass); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border); 
            border-radius: 28px; 
            padding: 40px 36px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .card h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .card .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 32px; font-weight: 500; }

        /* ─ Imputs ─ */
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .form-group label { font-size: 0.85rem; font-weight: 700; color: #cbd5e1; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; top: 50%; transform: translateY(-50%); right: 16px; color: var(--muted); font-size: 1rem; }
        
        .input-wrap input {
            width: 100%; padding: 14px 44px 14px 16px; 
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border); border-radius: 14px; 
            color: #fff; font: inherit; font-size: 0.95rem; 
            transition: all 0.3s ease;
        }
        .input-wrap input:focus { 
            outline: none; border-color: #2dd4bf; 
            background: rgba(15, 23, 42, 0.7); 
            box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.15); 
        }
        .input-wrap input::placeholder { color: #64748b; }
        
        .toggle-pw { position: absolute; top: 50%; transform: translateY(-50%); left: 16px; cursor: pointer; color: var(--muted); border: none; background: none; transition: .2s; }
        .toggle-pw:hover { color: #fff; }

        .remember { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 24px; }
        .remember-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .remember-checkbox input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; }
        .forgot-link { color: #2dd4bf; text-decoration: none; font-weight: 600; transition: .2s; }
        .forgot-link:hover { color: #5eead4; }

        /* ─ Button ─ */
        .btn-submit {
            width: 100%; padding: 16px; 
            background: linear-gradient(135deg, var(--brand), #0d9488);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 14px; color: #fff; 
            font: inherit; font-size: 1.05rem; font-weight: 800;
            cursor: pointer; transition: all 0.3s ease; 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 10px 25px rgba(15, 118, 110, 0.4);
        }
        .btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 15px 35px rgba(15, 118, 110, 0.5); 
            background: linear-gradient(135deg, #14b8a6, var(--brand));
        }
        .btn-submit:disabled { opacity: 0.7; transform: none; cursor: not-allowed; }

        /* ─ Links & Divider ─ */
        .divider { display: flex; align-items: center; gap: 16px; margin: 28px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .divider span { color: #64748b; font-size: 0.85rem; font-weight: 600; }

        .links { text-align: center; }
        .links a { color: #2dd4bf; text-decoration: none; font-weight: 700; transition: .2s; margin-right: 5px; }
        .links a:hover { color: #5eead4; text-shadow: 0 0 10px rgba(45,212,191,0.4); }
        .links p { font-size: 0.95rem; color: #cbd5e1; }

        .artisan-link { margin-top: 24px; text-align: center; padding-top: 20px; border-top: 1px solid var(--border); }
        .artisan-link a { color: var(--muted); font-size: 0.9rem; text-decoration: none; font-weight: 600; transition: .2s; }
        .artisan-link a:hover { color: #f97316; }

        /* ─ Alerts ─ */
        .alert { padding: 14px 18px; border-radius: 12px; font-size: 0.9rem; margin-bottom: 20px; display: none; font-weight: 600; }
        .alert.error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
        .alert.success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7; }
        .alert.show { display: block; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:translateY(0)} }

        @media(max-width: 520px) {
            .card { padding: 32px 24px; }
            .logo-area .brand { font-size: 2.4rem; }
        }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div class="wrap">
        <div class="logo-area">
            <div class="brand"><span data-i18n="cl_brand">حرفي</span> <i class="fa-solid fa-handshake"></i></div>
            <p data-i18n="cl_portal">بوابة العملاء — بوابتك لإنجاز جميع خدماتك</p>
        </div>

        <div class="card">
            <h2 data-i18n="cl_welcome">مرحباً بعودتك 👋</h2>
            <p class="sub" data-i18n="cl_sub">سجّل دخولك للوصول إلى لوحة التحكم ونشر طلباتك للصناع</p>

            <div class="alert error" id="alertBox"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email" data-i18n="cl_email">البريد الإلكتروني</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="example@email.com" data-i18n-placeholder="cl_email_ph" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="cl_pass">كلمة المرور</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" data-i18n-placeholder="cl_pass_ph" required autocomplete="current-password">
                        <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Toggle password visibility"><i class="fa-regular fa-eye" id="eyeIcon"></i></button>
                    </div>
                </div>

                <div class="remember">
                    <label class="remember-checkbox">
                        <input type="checkbox" id="remember"> <span data-i18n="cl_remember">تذكّرني</span>
                    </label>
                    <a href="forgot_password.html" class="forgot-link" data-i18n="cl_forgot">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span data-i18n="cl_btn">تسجيل الدخول</span> <i class="fa-solid fa-arrow-left"></i>
                </button>
            </form>

            <div class="divider"><span data-i18n="cl_or_new">أو إذا كنت جديداً</span></div>

            <div class="links">
                <p><span data-i18n="cl_no_account">ليس لديك حساب؟</span> <a href="client_register.html" data-i18n="cl_create_free">إنشاء حساب مجاني</a></p>
            </div>
            
            <div class="artisan-link">
                <a href="hirafi_login.html"><i class="fa-solid fa-hammer"></i> <span data-i18n="cl_artisan_link">أنت مقدم خدمات (حرفي)؟ سجّل دخولك من هنا</span></a>
            </div>
        </div>
    </div>

    <script src="lang_dict.js"></script>
    <script src="script.js"></script>
    <script>
        function togglePw() {
            const inp = document.getElementById('password');
            const ico = document.getElementById('eyeIcon');
            const show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            ico.className = show ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        }

        function showAlert(msg, type = 'error') {
            const el = document.getElementById('alertBox');
            el.textContent = msg;
            el.className = 'alert ' + type + ' show';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            const rem = document.getElementById('remember').checked;

            if (!email || !pass) { 
                showAlert('يرجى ملء جميع الحقول'); 
                return; 
            }

            btn.disabled = true;
            btn.innerHTML = 'جارٍ الدخول... <i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const res = await fetch('backend/client_login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: pass, remember: rem })
                });
                const data = await res.json();
                
                if (data.success) {
                    showAlert(data.message, 'success');
                    setTimeout(() => { window.location.href = data.redirect || 'backend/client_dashboard.php'; }, 1000);
                } else {
                    showAlert(data.message || 'خطأ في تسجيل الدخول');
                    btn.disabled = false;
                    btn.innerHTML = 'تسجيل الدخول <i class="fa-solid fa-arrow-left"></i>';
                }
            } catch (error) {
                showAlert('خطأ في الاتصال بالخادم');
                btn.disabled = false;
                btn.innerHTML = 'تسجيل الدخول <i class="fa-solid fa-arrow-left"></i>';
            }
        });
    </script>
</body>
</html>
