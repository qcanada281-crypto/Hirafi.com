    <script>
        // ناخد العناصر الرئيسية
        const searchBtn = document.getElementById('searchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultsEl = document.getElementById('results');
        const resultsSummary = document.getElementById('resultsSummary');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const loadMoreWrap = document.getElementById('loadMoreWrap');
        const PAGE_SIZE = 10;
        let currentCraftsmen = [];
        let visibleCount = 0;

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeAssetPath(path) {
            const raw = String(path || '').trim();
            if (raw === '') {
                return 'img/default-avatar.png';
            }
            if (/^(https?:)?\/\//i.test(raw) || raw.startsWith('/') || raw.startsWith('data:')) {
                return raw;
            }
            if (raw.startsWith('../')) {
                return raw.slice(3);
            }
            return raw;
        }

        function buildStars(rating) {
            const safe = Math.max(0, Math.min(5, Number(rating) || 0));
            const full = Math.floor(safe);
            const half = safe - full >= 0.5;
            const empty = 5 - full - (half ? 1 : 0);
            return (
                '<i class="fas fa-star"></i>'.repeat(full) +
                (half ? '<i class="fas fa-star-half-alt"></i>' : '') +
                '<i class="far fa-star"></i>'.repeat(Math.max(0, empty))
            );
        }

        // دالة لجلب النتائج من السيرفر
        async function fetchResults(profession, city, minRating = 0) {
            try {
                // نعمل باراميترات البحث
                const params = new URLSearchParams();
                if (profession) params.append('profession', profession);
                if (city) params.append('city', city);
                if (minRating) params.append('minRating', minRating);

                // نرسل الطلب للسيرفر
               const res = await fetch('backend/search.php?' + params.toString());

                const data = await res.json(); // ناخد الجواب كـ JSON

                if (data.success) return data.craftsmen; // إذا نجح، نرجع القائمة
                return []; // إذا ماشي، نرجع فارغة
            } catch (e) {
                console.error(e); // نطبعو الخطأ
                return []; // نرجع فارغة
            }
        }

        // دالة لعمل بطاقة حرفي بسيطة
        function renderCard(c) {
            const rating = Number(c.rating || 0).toFixed(1);
            const avatar = escapeHtml(normalizeAssetPath(c.avatar));
            const name = escapeHtml(c.name || 'حرفي');
            const profession = escapeHtml(c.profession || 'غير محدد');
            const city = escapeHtml(c.city || 'غير محدد');
            const excerptRaw = String(c.excerpt || 'حرفي مسجل على المنصة.');
            const excerpt = escapeHtml(excerptRaw.length > 80 ? `${excerptRaw.slice(0, 80)}...` : excerptRaw);
            const reviews = Number(c.total_reviews || 0);
            const profileUrl = 'profile.html?id=' + c.id;
            const phone = escapeHtml(c.phone || '');

            return `
                <a href="${profileUrl}" class="craftsman-card" style="text-decoration:none;color:inherit;display:block;">
                    <div class="card-head">
                        <div class="craftsman-avatar">
                            <img src="${avatar}" alt="${name}">
                        </div>
                        <div class="card-body">
                            <h3 class="craftsman-name">${name}</h3>
                            <div class="meta">
                                <span class="pill"><i class="fas fa-tools"></i> ${profession}</span>
                                <span class="pill"><i class="fas fa-map-marker-alt"></i> ${city}</span>
                            </div>
                        </div>
                    </div>
                    <p class="craftsman-excerpt">${excerpt}</p>
                    <div class="card-footer">
                        <div class="contact-info">
                            <span class="phone-display"><i class="fas fa-user"></i> عرض الملف</span>
                        </div>
                        <div class="rating-box small-rating">${buildStars(rating)} <span>${rating}</span> <span style="color:#64748b;font-size:.8rem">(${reviews} تقييم)</span></div>
                    </div>
                </a>
            `;
        }

        // دالة بسيطة للتواصل مع الحرفي
        function contactCraftsman(phone, name) {
            if (phone && phone !== 'undefined') {
                if (confirm(`هل تريد التواصل مع ${name} على الرقم: ${phone}؟`)) {
                    window.open(`tel:${phone}`);
                }
            } else {
                alert('يرجى تسجيل الدخول لعرض معلومات التواصل');
            }
        }

        function renderVisibleResults(reset = false) {
            if (reset) {
                visibleCount = 0;
                resultsEl.innerHTML = '';
            }

            const nextCount = Math.min(currentCraftsmen.length, visibleCount + PAGE_SIZE);
            const batch = currentCraftsmen.slice(visibleCount, nextCount);
            if (batch.length > 0) {
                resultsEl.insertAdjacentHTML('beforeend', batch.map(renderCard).join(''));
                visibleCount = nextCount;
            }

            if (resultsSummary) {
                const lang = localStorage.getItem('hirafi_lang') || 'ar';
                const tmpl = (window.translations && window.translations[lang] && window.translations[lang]['search_results_summary']) ? window.translations[lang]['search_results_summary'] : 'عرض ${count} من أصل ${total} حرفي';
                resultsSummary.textContent = tmpl.replace('${count}', visibleCount).replace('${total}', currentCraftsmen.length);
            }

            if (loadMoreWrap) {
                loadMoreWrap.hidden = visibleCount >= currentCraftsmen.length;
            }
        }

        // دالة البحث الرئيسية
        async function doSearch() {
            // ناخد القيم من المداخل
            const profession = document.getElementById('professionManual').value.trim() || document.getElementById('profession').value;
            const city = document.getElementById('cityManual').value.trim() || document.getElementById('city').value;
            const minRating = document.getElementById('minRating').value || 0;

            // نعرض رسالة تحميل للنتائج العادية
            resultsEl.innerHTML = '<div class="results-info">جارٍ البحث...</div>';

            // نجلب النتائج العادية
            const craftsmen = await fetchResults(profession, city, minRating);
            currentCraftsmen = Array.isArray(craftsmen) ? craftsmen : [];

            // إذا ماكاينش نتائج
            if (!currentCraftsmen || currentCraftsmen.length === 0) {
                resultsEl.innerHTML = '<div class="results-info">لم يتم العثور على حرفيين مطابقين.</div>';
                return;
            }

            renderVisibleResults(true);
        }

        // نضيف الأفعال للأزرار
        searchBtn.addEventListener('click', (e) => { 
            e.preventDefault(); // مانع التسجيل العادي
            doSearch(); // ننفذ البحث
        });
        
        clearBtn.addEventListener('click', (e) => {
            e.preventDefault();
            // نفضي الفلاتر
            document.getElementById('profession').value = '';
            document.getElementById('professionManual').value = '';
            document.getElementById('city').value = '';
            document.getElementById('cityManual').value = '';
            document.getElementById('minRating').value = '0';
            doSearch(); // ننفذ البحث من جديد
        });

        if (loadMoreBtn) {
            loadMoreBtn.addEventListener('click', () => {
                renderVisibleResults(false);
            });
        }

        function applyFiltersFromUrl() {
            const url = new URL(window.location.href);
            const profession = url.searchParams.get('profession') || '';
            const city = url.searchParams.get('city') || '';
            const minRating = url.searchParams.get('minRating') || '';

            const professionEl = document.getElementById('profession');
            const cityEl = document.getElementById('city');
            const minRatingEl = document.getElementById('minRating');

            if (professionEl && profession) professionEl.value = profession;
            if (cityEl && city) cityEl.value = city;
            if (minRatingEl && minRating) minRatingEl.value = minRating;
        }

        // تهيئة الفلاتر الديناميكية
        if (window.populateCitiesSelect) {
            populateCitiesSelect('city', 'cityManual');
        }
        if (window.populateCraftsSelect) {
            populateCraftsSelect('profession');
        }

        // ننفذ البحث الأولي عند تحميل الصفحة
        applyFiltersFromUrl();
        doSearch();
    </script>
    <script src="lang_dict.js"></script>
    <script src="script.js"></script>
</body>
</html>
