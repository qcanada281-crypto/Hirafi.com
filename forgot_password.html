<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور - خدمة الحرفيين المغاربة</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="img/favicon.jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ========== ⭐ خلفية الصفحة (تدرج ألوان) ⭐ ========== */
        /* 🎨 خلفية بتدرج ثلاثي الألوان: بنفسجي، بني، أخضر زيتوني */
        body { 
            background: linear-gradient(150deg, #8c0ea5 ,#7a3f2b 20%, #8c9605 60%); 
            color:#ffffff; 
            font-family: 'Tajawal', Arial, sans-serif; 
        }
        
        /* ========== ⭐ قسم المصادقة ⭐ ========== */
        .auth-section { 
            padding:48px 0; /* مسافة علوية وسفلية */
        }
        
        /* 🃏 بطاقة المصادقة الرئيسية */
        .auth-card{ 
            max-width:640px; /* أقصى عرض */
            margin:0 auto; /* توسيط أفقي */
            background:#fff; /* خلفية بيضاء */
            border-radius:12px; /* زوايا مدورة */
            padding:28px; /* مسافة داخلية */
            box-shadow:0 12px 36px rgba(45,35,25,0.06); /* ظل ناعم */
        }
        
        /* ========== ⭐ تنسيق النصوص ⭐ ========== */
        .auth-card h2{ 
            margin:0 0 8px; /* مسافة سفنية */
            color:#3b2f2f; /* لون بني داكن */
        }
        .auth-card p{ 
            color:#5b4b45; /* لون بني متوسط */
            margin-bottom:16px; /* مسافة سفنية */
        }

        /* ========== ⭐ تنسيق حقول النموذج ⭐ ========== */
        .form-group label{ 
            display:block; /* عرض كتلة */
            margin-bottom:8px; /* مسافة سفنية */
            color:#58433d; /* لون بني */
            font-weight:600; /* نص عريض */
        }
        
        /* 📝 حقل الإدخال */
        .form-group input{ 
            width:100%; /* عرض كامل */
            padding:12px 14px; /* مسافة داخلية */
            border-radius:10px; /* زوايا مدورة */
            border:1px solid #efe6e2; /* إطار فاتح */
            background:#fff; /* خلفية بيضاء */
            transition: box-shadow .16s ease, border-color .16s ease, transform .12s ease; /* انتقالات */
            font-size:14px; /* حجم الخط */
            color:#2b2b2b; /* لون نص داكن */
        }
        
        /* 🏷️ نص المكان الشفاف */
        .form-group input::placeholder{ 
            color:#9b8b86; /* لون رمادي بني */
        }

        /* ========== ⭐ تأثيرات التمرير والتركيز ⭐ ========== */
        /* 🖱️ عند تمرير المؤشر على الحقل */
        .form-group input:hover{ 
            border-color:#a66b4a; /* إطار بني فاتح */
            box-shadow:0 10px 28px rgba(166,107,74,0.08); /* ظل خفيف */
            transform:translateY(-2px); /* حركة لأعلى */
        }
        
        /* 🎯 عند التركيز على الحقل */
        .form-group input:focus{ 
            border-color:#7a3f2b; /* إطار بني داكن */
            box-shadow:0 14px 36px rgba(122,63,43,0.12); /* ظل متوسط */
            outline:none; /* إزالة الحد الخارجي */
        }

        /* ========== ⭐ زر الإرسال ⭐ ========== */
        .btn-primary{ 
            display:inline-block; /* عرض داخلي-كتلي */
            padding:12px 16px; /* مسافة داخلية */
            background:#7a3f2b; /* خلفية بنية */
            color:#fff; /* نص أبيض */
            border-radius:10px; /* زوايا مدورة */
            border:none; /* بدون إطار */
            font-weight:700; /* نص عريض جداً */
            cursor:pointer; /* مؤشر يد */
            box-shadow:0 10px 30px rgba(122,63,43,0.14); /* ظل */
            transition: transform .12s ease, box-shadow .12s ease; /* انتقالات */
        }
        
        /* 🖱️ عند تمرير المؤشر على الزر */
        .btn-primary:hover{ 
            transform:translateY(-3px); /* حركة لأعلى */
            box-shadow:0 18px 42px rgba(122,63,43,0.18); /* ظل أقوى */
        }

        /* ========== ⭐ رسائل التنبيه ⭐ ========== */
        /* ⚠️ رسالة تحذير/إشعار */
        .form-notice{ 
            padding:10px 12px; /* مسافة داخلية */
            border-radius:8px; /* زوايا مدورة */
            background:#fff4f1; /* خلفية وردية فاتحة */
            color:#7a3f2b; /* نص بني */
            border:1px solid rgba(122,63,43,0.06); /* إطار شفاف */
        }
        
        /* ✅ رسالة نجاح */
        .success-message{ 
            padding:10px 12px; /* مسافة داخلية */
            border-radius:8px; /* زوايا مدورة */
            background:#f7faf6; /* خلفية خضراء فاتحة */
            color:#2b6a4a; /* نص أخضر داكن */
            border:1px solid rgba(43,106,74,0.06); /* إطار شفاف */
        }

        /* ========== ⭐ مؤشر التحميل ⭐ ========== */
        /* 🌀 مؤشر تدوير (spinner) */
        .spinner{ 
            width:24px; /* عرض */
            height:24px; /* ارتفاع */
            border:3px solid rgba(122,63,43,0.18); /* إطار شفاف */
            border-top-color:#7a3f2b; /* لون الجزء العلوي */
            border-radius:50%; /* دائري */
            animation:spin .9s linear infinite; /* حركة تدوير */
            display:inline-block; /* عرض داخلي-كتلي */
            vertical-align:middle; /* توسيط عمودي */
            margin-left:8px; /* مسافة يسارية */
        }
        
        /* 🔄 حركة التدوير */
        @keyframes spin{ 
            to { 
                transform:rotate(360deg); /* تدوير 360 درجة */
            } 
        }

        /* ========== ⭐ تصميم متجاوب للهواتف ⭐ ========== */
        @media (max-width:720px){ 
            .auth-card{ 
                padding:20px; /* تقليل المسافة */
                margin:12px; /* تقليل الهوامش */
            } 
        }
    </style>
</head>
<body>
    <!-- ========== ⭐ رأس الصفحة (النافبار) ⭐ ========== -->
    <header class="navbar">
        <div class="container">
            <nav class="nav-container">
                <!-- 🔗 رابط الشعار -->
                <a href="index.html" class="logo">
                    <div class="logo-text"><h1>خدمة الحرفيين المغاربة</h1></div>
                </a>
                
                <!-- 📋 قائمة التنقل -->
                <ul class="nav-menu">
                    <li><a href="index.html" data-i18n="nav_home">الرئيسية</a></li>
                    <li><a href="hirafi_login.html"class="nav-link btn-login" data-i18n="nav_login">تسجيل الدخول</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- ========== ⭐ المحتوى الرئيسي ⭐ ========== -->
    <main class="main-content">
        <section class="auth-section">
            <div class="container">
                <div class="auth-card">
                    <!-- 📝 عنوان الصفحة -->
                    <h2 data-i18n="forgot_title">نسيت كلمة المرور</h2>
                    <p data-i18n="forgot_desc">أدخل بريدك الإلكتروني لنرسل لك رابط إعادة تعيين كلمة المرور.</p>

                    <!-- 💬 مكان عرض الرسائل -->
                    <div id="notice" class="form-notice" style="display:none;margin-bottom:1rem;"></div>

                    <!-- 📋 نموذج إدخال البريد الإلكتروني -->
                    <form id="forgotForm">
                        <div class="form-group">
                            <label for="email" data-i18n="admin_login_email">البريد الإلكتروني</label>
                            <input type="email" id="email" name="email" placeholder="example@email.com" data-i18n="forgot_email_placeholder" required>
                        </div> <br>
                        <!-- 🚀 زر إرسال النموذج -->
                        <center><button type="submit" class="btn btn-primary" data-i18n="forgot_btn">إرسال رابط إعادة التعيين</button></center>
                    </form><br><br>

                    <!-- 🔙 رابط العودة -->
                    <h4 style="margin-top:1rem;"><a href="hirafi_login.html" data-i18n="forgot_back">← العودة لتسجيل الدخول</a></h4>
                </div>
            </div>
        </section>
    </main>

    <!-- ========== ⭐ جافاسكريبت ⭐ ========== -->
    <script>
        // 🔍 الحصول على النموذج ومكان عرض الرسائل
        const form = document.getElementById('forgotForm');
        const notice = document.getElementById('notice');

        // 📢 دالة لعرض الرسائل
        function show(msg, type = 'info'){
            notice.style.display = 'block'; // إظهار العنصر
            notice.textContent = msg; // تعيين نص الرسالة
            // 🎨 تعيين النمط المناسب حسب نوع الرسالة
            notice.className = type === 'success' ? 'success-message' : 'form-notice';
            // ⏰ إخفاء الرسالة بعد 8 ثواني
            setTimeout(()=> notice.style.display = 'none', 8000);
        }

        // 🎯 إضافة حدث إرسال النموذج
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // منع الإرسال الافتراضي
            
            // 📧 الحصول على قيمة البريد الإلكتروني
            const email = document.getElementById('email').value.trim();
            
            // ⚠️ التحقق من إدخال البريد
            if (!email) return show('الرجاء إدخال البريد الإلكتروني');

            try {
                // 🌐 إرسال طلب لخادم PHP
                const res = await fetch('backend/forgot_password.php', {
                    method: 'POST', // طريقة POST
                    headers: { 'Content-Type': 'application/json' }, // ترويسة JSON
                    body: JSON.stringify({ email }) // تحويل البيانات لـ JSON
                });
                
                // 📄 تحويل الرد إلى JSON
                const data = await res.json();
                
                // ✅ إذا نجحت العملية
                if (data.success) {
                    show(data.message || 'تم إنشاء طلب إعادة التعيين', 'success');
                    // 🔍 طباعة التوكن في الكونسول (للتجربة فقط)
                    if (data.token) console.info('reset token:', data.token);
                } 
                // ❌ إذا فشلت العملية
                else {
                    show(data.message || 'لم يتم العثور على البريد', '');
                }
            } 
            // 🚨 في حالة حدوث خطأ
            catch (err) {
                console.error(err); // طباعة الخطأ في الكونسول
                show('حدث خطأ في الاتصال. حاول لاحقاً'); // عرض رسالة للمستخدم
            }
        });
    </script>
    <script src="lang_dict.js"></script>
    <script src="script.js"></script>
</body>
</html>
